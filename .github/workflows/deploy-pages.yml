name: Deploy static site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Use Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Require a project GitHub Pages repository
        shell: bash
        run: |
          reserved="${GITHUB_REPOSITORY_OWNER}.github.io"
          actual="${GITHUB_REPOSITORY#*/}"
          if [[ "$actual" == "$reserved" ]]; then
            echo "Rename this repository so the map publishes below /<repository-name>/ and leaves the account root free."
            exit 1
          fi

      - name: Build static site
        env:
          GITHUB_PAGES_BUILD: "true"
        run: |
          npm run build
          test -f dist/client/index.html

      - name: Disable Jekyll processing
        run: touch dist/client/.nojekyll

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload static artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist/client

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
