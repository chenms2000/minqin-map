name: Deploy static site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Use Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Require a root GitHub Pages repository
        shell: bash
        run: |
          expected="${GITHUB_REPOSITORY_OWNER}.github.io"
          actual="${GITHUB_REPOSITORY#*/}"
          if [[ "$actual" != "$expected" ]]; then
            echo "Rename or create the repository as $expected so this map can use root-relative PMTiles and media URLs."
            exit 1
          fi

      - name: Build static site
        run: npm run build

      - name: Disable Jekyll processing
        run: touch dist/client/.nojekyll

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload static artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist/client

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
