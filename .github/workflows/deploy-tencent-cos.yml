name: Deploy static site to Tencent COS

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tencent-cos-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Use Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build static site for Tencent COS
        shell: bash
        env:
          SITE_URL: ${{ vars.SITE_URL }}
        run: |
          if [[ ! "$SITE_URL" =~ ^https://[^/]+/?$ ]]; then
            echo "SITE_URL must be an HTTPS origin URL without a path."
            exit 1
          fi

          export SITE_URL="${SITE_URL%/}/"
          npm run build
          test -f dist/client/index.html

      - name: Sync dist/client to Tencent COS
        shell: bash
        env:
          COS_SECRET_ID: ${{ secrets.COS_SECRET_ID }}
          COS_SECRET_KEY: ${{ secrets.COS_SECRET_KEY }}
          COS_BUCKET: ${{ vars.COS_BUCKET }}
          COS_REGION: ${{ vars.COS_REGION }}
          COSCLI_VERSION: v1.0.8
          COSCLI_SHA256: 7165f2ae16c5f7ac495864c963ca574a76e04ec72680d7bc8a8eee3234d8cf91
        run: |
          missing=()
          for name in COS_SECRET_ID COS_SECRET_KEY COS_BUCKET COS_REGION; do
            if [[ -z "${!name:-}" ]]; then
              missing+=("$name")
            fi
          done

          if (( ${#missing[@]} > 0 )); then
            echo "Missing GitHub Actions configuration: ${missing[*]}"
            exit 1
          fi

          if [[ ! "$COS_BUCKET" =~ ^[a-z0-9][a-z0-9-]*-[0-9]+$ ]]; then
            echo "COS_BUCKET must be the full bucket name including the APPID suffix."
            exit 1
          fi

          if [[ "$COS_REGION" != "ap-hongkong" ]]; then
            echo "COS_REGION must be ap-hongkong for this Hong Kong pilot."
            exit 1
          fi

          coscli_path="${RUNNER_TEMP}/coscli"
          curl --fail --location --silent --show-error \
            "https://github.com/tencentyun/coscli/releases/download/${COSCLI_VERSION}/coscli-${COSCLI_VERSION}-linux-amd64" \
            --output "$coscli_path"
          echo "${COSCLI_SHA256}  ${coscli_path}" | sha256sum --check --strict
          chmod +x "$coscli_path"

          "$coscli_path" sync dist/client/ "cos://${COS_BUCKET}/" \
            --recursive \
            --endpoint "cos.${COS_REGION}.myqcloud.com" \
            --secret-id "$COS_SECRET_ID" \
            --secret-key "$COS_SECRET_KEY" \
            --init-skip=true
